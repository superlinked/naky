[package]
name = "naky"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "naky"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
av1-decoder = { path = "../av1-decoder", default-features = false, features = ["asm"] }
clap.workspace = true
perception = { path = "../perception" }
screenevents = { path = "../screenevents" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { version = "=0.7.0", default-features = false }

[lints]
workspace = true
